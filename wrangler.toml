name = "githubstudio"
main = "src/index.ts"
compatibility_date = "2026-06-01"
minify = true

[observability]
enabled = true

# one structured log line per card request; sample to keep log volume sane under heavy traffic
[observability.logs]
enabled = true
head_sampling_rate = 0.2
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 0.2
persist = true

# Configuration (set secrets with `wrangler secret put <NAME>`):
#   GITHUB_TOKEN   - recommended. Enables GraphQL: real stars, language bytes, exact daily
#                    contributions and far higher rate limits. No scopes needed (public data).
#   GITHUB_TOKENS  - optional comma-separated pool of extra tokens. Requests go to the healthiest
#                    token; rate-limited or revoked tokens are benched automatically.
#   BLOCKLIST      - optional comma-separated usernames to refuse.
#   ADMIN_TOKEN    - optional bearer token for live quota at /api/rate-limit.
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN
#                  - optional, enables /api/spotify for the deployer's own Spotify account.
[vars]
CACHE_SECONDS = "1800"

# Abuse protection (Workers Rate Limiting). Only consulted on cache misses, so cached traffic is free.
# Regular clients are limited per IP; GitHub's image proxy (camo) is limited per username instead,
# because it fetches every README image from a few shared IPs. Remove these blocks to disable.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Profile view counter (/api/views). SQLite-backed Durable Objects work on the free plan.
# Remove these blocks to disable the counter; the card then explains it isn't set up.
[[durable_objects.bindings]]
name = "VIEWS"
class_name = "ViewCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ViewCounter"]
